apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      volumes:
      - name: tmp
        emptyDir: {}
      containers:
      - name: api
        image: 499503541876.dkr.ecr.us-east-1.amazonaws.com/api:__SHA__
        ports:
        - containerPort: 3000
        env:
        - name: API_TOKEN
          valueFrom:
            secretKeyRef:
              name: api-secret
              key: token
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: api-db-config
              key: db_host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: api-db-config
              key: db_port
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: api-db-config
              key: db_name
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: api-db-config
              key: db_user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: api-db-secret
              key: password
        - name: DB_SSL
          value: "true"
        - name: HOME
          value: /tmp
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        livenessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
