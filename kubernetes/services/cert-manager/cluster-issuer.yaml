# Instalar cert-manager antes de aplicar este manifiesto:
#   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.15.1/cert-manager.yaml
# (crea el namespace "cert-manager" y los CRDs necesarios)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # Entorno de produccion de Let's Encrypt. Usa staging para pruebas:
    # server: https://acme-staging-v02.api.letsencrypt.org/directory
    server: https://acme-v02.api.letsencrypt.org/directory
    # CAMBIAR por un email real para avisos de renovacion/expiracion.
    email: admin@example.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            class: nginx
