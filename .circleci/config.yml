version: 2.1

orbs:
  aws-cli: circleci/aws-cli@4.1.0

jobs:
  test:
    docker:
      - image: cimg/node:18.20
      # Postgres real para los tests de integracion de la API (CRUD productos).
      - image: postgres:15
        environment:
          POSTGRES_DB: appdb
          POSTGRES_USER: dbadmin
          POSTGRES_PASSWORD: Password123!_
    steps:
      - checkout
      - run:
          name: Wait for postgres
          command: |
            for i in $(seq 1 30); do
              if (exec 3<>/dev/tcp/localhost/5432) 2>/dev/null; then
                echo "postgres up"; break
              fi
              sleep 2
            done
      - run:
          name: Run tests for each service
          command: |
            export DB_HOST=localhost
            export DB_PORT=5432
            export DB_NAME=appdb
            export DB_USER=dbadmin
            export DB_PASSWORD=Password123!_
            for svc in api frontend worker; do
              echo "=== Testing $svc ==="
              cd "docker/$svc"
              npm install
              npm test
              cd ../..
            done

  build-and-push:
    docker:
      - image: cimg/node:18.20
    environment:
      ECR_REGISTRY: "499503541876.dkr.ecr.us-east-1.amazonaws.com"
      AWS_REGION: "us-east-1"
    steps:
      - checkout
      - setup_remote_docker
      - aws-cli/install
      # Asume el rol de AWS via OIDC (sin claves estaticas) usando el token OIDC de CircleCI.
      - run:
          name: Assume AWS role via OIDC
          command: |
            CREDS=$(aws sts assume-role-with-web-identity \
              --role-arn "$AWS_ROLE_ARN" \
              --role-session-name circleci-ecr \
              --web-identity-token "$CIRCLE_OIDC_TOKEN" \
              --duration-seconds 3600 \
              --output text \
              --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]')
            AK=$(printf '%s' "$CREDS" | cut -d$'\t' -f1)
            SK=$(printf '%s' "$CREDS" | cut -d$'\t' -f2)
            ST=$(printf '%s' "$CREDS" | cut -d$'\t' -f3)
            echo "export AWS_ACCESS_KEY_ID=$AK" >> "$BASH_ENV"
            echo "export AWS_SECRET_ACCESS_KEY=$SK" >> "$BASH_ENV"
            echo "export AWS_SESSION_TOKEN=$ST" >> "$BASH_ENV"
            echo "export AWS_REGION=$AWS_REGION" >> "$BASH_ENV"
      - run:
          name: Login to Amazon ECR
          command: |
            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "$ECR_REGISTRY"
      - run:
          name: Build and push images (SHA + latest)
          command: |
            for svc in api frontend worker; do
              echo "=== Building $svc ==="
              docker build \
                -t "$ECR_REGISTRY/$svc:${CIRCLE_SHA1}" \
                -t "$ECR_REGISTRY/$svc:latest" \
                -f "docker/$svc/Dockerfile" "docker/$svc"
              docker push "$ECR_REGISTRY/$svc:${CIRCLE_SHA1}"
              docker push "$ECR_REGISTRY/$svc:latest"
            done

  deploy:
    docker:
      - image: cimg/base:stable
    parameters:
      cluster-name:
        type: string
        default: "cloudops-cluster"
      aws-region:
        type: string
        default: "us-east-1"
    steps:
      - checkout
      - aws-cli/install
      # Asume el rol de AWS via OIDC (sin claves estaticas) usando el token OIDC de CircleCI.
      - run:
          name: Assume AWS role via OIDC
          command: |
            CREDS=$(aws sts assume-role-with-web-identity \
              --role-arn "$AWS_ROLE_ARN" \
              --role-session-name circleci-deploy \
              --web-identity-token "$CIRCLE_OIDC_TOKEN" \
              --duration-seconds 3600 \
              --output text \
              --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]')
            AK=$(printf '%s' "$CREDS" | cut -d$'\t' -f1)
            SK=$(printf '%s' "$CREDS" | cut -d$'\t' -f2)
            ST=$(printf '%s' "$CREDS" | cut -d$'\t' -f3)
            echo "export AWS_ACCESS_KEY_ID=$AK" >> "$BASH_ENV"
            echo "export AWS_SECRET_ACCESS_KEY=$SK" >> "$BASH_ENV"
            echo "export AWS_SESSION_TOKEN=$ST" >> "$BASH_ENV"
            echo "export AWS_REGION=<<parameters.aws-region>>" >> "$BASH_ENV"
      - run:
          name: Install kubectl
          command: |
            KUBECTL_VER=$(curl -L -s https://dl.k8s.io/release/stable.txt)
            curl -L -o kubectl "https://dl.k8s.io/release/${KUBECTL_VER}/bin/linux/amd64/kubectl"
            chmod +x kubectl
            sudo mv kubectl /usr/local/bin/
      - run:
          name: Update kubeconfig for EKS
          command: |
            aws eks update-kubeconfig --name "<<parameters.cluster-name>>" --region "<<parameters.aws-region>>"
      - run:
          name: Create api-secret from CI variable
          command: |
            kubectl get secret api-secret >/dev/null 2>&1 || \
              kubectl create secret generic api-secret --from-literal=token="${API_TOKEN}"
      - run:
          name: Deploy to EKS with immutable SHA image
          command: |
            ECR="499503541876.dkr.ecr.us-east-1.amazonaws.com"
            kubectl apply -f kubernetes/deployments/api/deployment.yaml
            kubectl apply -f kubernetes/deployments/frontend/deployment.yaml
            kubectl apply -f kubernetes/deployments/worker/deployment.yaml
            kubectl apply -f kubernetes/services/internal/api-service.yaml
            kubectl apply -f kubernetes/services/internal/frontend-service.yaml
            kubectl apply -f kubernetes/services/ingress-nginx/ingress.yaml
            kubectl apply -f kubernetes/services/network-policy.yaml
            kubectl set image deployment/api-deployment \
              api="$ECR/api:${CIRCLE_SHA1}"
            kubectl set image deployment/frontend-deployment \
              frontend="$ECR/frontend:${CIRCLE_SHA1}"
            kubectl set image deployment/worker-deployment \
              worker="$ECR/worker:${CIRCLE_SHA1}"
            kubectl rollout status deployment/api-deployment --timeout=180s
            kubectl rollout status deployment/frontend-deployment --timeout=180s
            kubectl rollout status deployment/worker-deployment --timeout=180s
      - run:
          name: Smoke test (produccion alcanzable)
          command: |
            ELB=$(kubectl get svc ingress-nginx-controller -n ingress-nginx \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null)
            echo "ELB=$ELB"
            [ -z "$ELB" ] && echo "ELB aun no asignado" && exit 0
            for i in $(seq 1 12); do
              code=$(curl -s -o /dev/null -w "%{http_code}" "http://$ELB/" || true)
              [ "$code" = "200" ] && break
              sleep 10
            done
            echo "frontend /        -> $(curl -s -o /dev/null -w '%{http_code}' http://$ELB/)"
            echo "api /api/health  -> $(curl -s -o /dev/null -w '%{http_code}' http://$ELB/api/health) (200 esperado)"

workflows:
  build-test-deploy:
    jobs:
      - test
      - build-and-push:
          requires:
            - test
          context: deploy-prod
          filters:
            branches:
              only: [main]
      - deploy:
          requires:
            - build-and-push
          context: deploy-prod
          filters:
            branches:
              only: [main]
