version: 2.1

orbs:
  aws-ecr: circleci/aws-ecr@8.2.1
  aws-eks: circleci/aws-eks@1.1.0
  kubernetes: circleci/kubernetes@1.3.0

jobs:
  # Despliega la imagen construida (tag = SHA del commit) en el deployment indicado.
  deploy:
    docker:
      - image: cimg/aws:2024.01
    parameters:
      deployment:
        type: string
      container:
        type: string
      repo:
        type: string
    steps:
      - kubernetes/install-kubectl
      - aws-eks/update-kubeconfig:
          cluster-name: cloudops-cluster
          aws-region: us-east-1
      - run:
          name: "Actualizar imagen a ${CIRCLE_SHA1}"
          command: |
            kubectl set image deployment/<< parameters.deployment >> \
              << parameters.container >>=499503541876.dkr.ecr.us-east-1.amazonaws.com/<< parameters.repo >>:${CIRCLE_SHA1}

workflows:
  build-and-push-services:
    jobs:
      - aws-ecr/build-and-push_image:
          name: push-api
          account-url: AWS_ECR_ACCOUNT_URL
          aws-access-key-id: AWS_ACCESS_KEY_ID
          aws-secret-access-key: AWS_SECRET_ACCESS_KEY
          region: AWS_DEFAULT_REGION
          repo: api
          path: docker/api
          dockerfile: Dockerfile
          # Tag inmutable = SHA del commit (evita :latest).
          tag: "${CIRCLE_SHA1}"

      - aws-ecr/build-and-push_image:
          name: push-worker
          account-url: AWS_ECR_ACCOUNT_URL
          aws-access-key-id: AWS_ACCESS_KEY_ID
          aws-secret-access-key: AWS_SECRET_ACCESS_KEY
          region: AWS_DEFAULT_REGION
          repo: worker
          path: docker/worker
          dockerfile: Dockerfile
          tag: "${CIRCLE_SHA1}"

      - aws-ecr/build-and-push_image:
          name: push-frontend
          account-url: AWS_ECR_ACCOUNT_URL
          aws-access-key-id: AWS_ACCESS_KEY_ID
          aws-secret-access-key: AWS_SECRET_ACCESS_KEY
          region: AWS_DEFAULT_REGION
          repo: frontend
          path: docker/frontend
          dockerfile: Dockerfile
          tag: "${CIRCLE_SHA1}"

      - deploy:
          name: deploy-api
          deployment: api-deployment
          container: api
          repo: api
          requires:
            - push-api

      - deploy:
          name: deploy-worker
          deployment: worker-deployment
          container: worker
          repo: worker
          requires:
            - push-worker

      - deploy:
          name: deploy-frontend
          deployment: frontend-deployment
          container: frontend
          repo: frontend
          requires:
            - push-frontend
